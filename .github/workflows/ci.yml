name: Lokma CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build + release QA
        id: build
        shell: bash
        run: |
          set +e
          npm run qa:release 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lokma-build-log
          path: build.log
          retention-days: 2

      - name: Upload review build
        if: steps.build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: lokma-review-dist
          path: dist
          retention-days: 2

      - name: Fail if QA failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1

name: Build Phone Preview

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build relative preview
        run: npm run build -- --base=./

      - name: Publish preview files into repository
        shell: bash
        run: |
          rm -rf preview
          mkdir -p preview
          cp -R dist/. preview/
          touch preview/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview
          if git diff --cached --quiet; then
            echo "Preview already current."
            exit 0
          fi
          git commit -m "chore: refresh phone preview [skip ci]"
          git push
